name: IndexNow notify

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and submit sitemap URLs
        env:
          SITE_ORIGIN: https://arizanerede.com
          INDEXNOW_KEY: 4263b010f9dddf31bf1b4023a3d6a82d
        run: |
          node <<'NODE'
          const origin = process.env.SITE_ORIGIN;
          const key = process.env.INDEXNOW_KEY;
          const keyLocation = `${origin}/${key}.txt`;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          let verified = false;
          for (let attempt = 1; attempt <= 18; attempt++) {
            try {
              const response = await fetch(keyLocation, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              const text = (await response.text()).trim();
              if (response.ok && text === key) {
                verified = true;
                break;
              }
            } catch {}
            await sleep(10000);
          }
          if (!verified) throw new Error(`IndexNow key is not live at ${keyLocation}`);

          const sitemapResponse = await fetch(`${origin}/sitemap.xml`, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
          if (!sitemapResponse.ok) throw new Error(`Sitemap fetch failed: ${sitemapResponse.status}`);
          const xml = await sitemapResponse.text();
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(match => match[1].replaceAll('&amp;', '&'));
          if (!urls.length) throw new Error('No URLs found in sitemap');
          if (urls.length > 10000) throw new Error(`IndexNow batch exceeds 10,000 URLs: ${urls.length}`);

          const payload = JSON.stringify({
            host: 'arizanerede.com',
            key,
            keyLocation,
            urlList: urls
          });
          const endpoints = [
            ['IndexNow general/Bing', 'https://api.indexnow.org/indexnow'],
            ['Yandex IndexNow', 'https://yandex.com/indexnow']
          ];
          const results = [];
          for (const [name, endpoint] of endpoints) {
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'content-type': 'application/json; charset=utf-8' },
                body: payload,
                signal: AbortSignal.timeout(20000)
              });
              const body = await response.text();
              results.push({ name, status: response.status, accepted: [200, 202].includes(response.status), body });
            } catch (error) {
              results.push({ name, status: 'network-error', accepted: false, body: error.message });
            }
          }
          for (const result of results) {
            console.log(`${result.name}: ${result.status}${result.body ? ` ${result.body}` : ''}`);
          }
          if (!results.some(result => result.accepted)) {
            throw new Error('No IndexNow endpoint accepted the sitemap URLs.');
          }
          console.log(`At least one IndexNow endpoint accepted ${urls.length} URLs.`);
          NODE
